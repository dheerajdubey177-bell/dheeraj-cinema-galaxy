    * {

    }

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      user-select: none;
    }

    /* Glowing Casino Marquee / Golden Bullet Text */
    .casino-bullet-text {
      font-family: 'Cinzel', 'Inter', serif;
      background: linear-gradient(180deg, #fffbeb 0%, #fde047 35%, #f59e0b 70%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 22px rgba(251, 191, 36, 0.35), 0 2px 4px rgba(0, 0, 0, 0.85);
      letter-spacing: 0.08em;
    }

    /* Marquee Bulbs Strip */
    .marquee-dots {
      background-image: radial-gradient(circle, #fde047 1.5px, transparent 2px);
      background-size: 12px 6px;
      animation: marqueePulse 1.8s infinite alternate ease-in-out;
    }

    @keyframes marqueePulse {
      0% { opacity: 0.45; filter: drop-shadow(0 0 2px #f59e0b); }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #fde047); }
    }

    /* Custom Scrollbar for Directory & Modal */
    .cinema-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .cinema-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    .cinema-scroll::-webkit-scrollbar-thumb {
      background: rgba(251, 191, 36, 0.35);
      border-radius: 9999px;
    }
    .cinema-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(251, 191, 36, 0.65);
    }

    /* Glassmorphic Panels */
    .glass-panel {
      background: rgba(9, 13, 26, 0.90);
      border: 1px solid rgba(251, 191, 36, 0.28);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .glass-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-pill:hover {
      border-color: rgba(251, 191, 36, 0.55);
      background: rgba(30, 41, 59, 0.95);
    }

    #globe-canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    // ============================================================================
    function isValidPhotoUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const lower = url.toLowerCase();
      if (!lower.startsWith('http')) return false;
      if (
        lower.endsWith('.svg') ||
        lower.includes('placeholder') ||
        lower.includes('no_image') ||
        lower.includes('question_book') ||
        lower.includes('ambox') ||
        lower.includes('commons-logo')
      ) {
        return false;
      }
      return true;
    }

    function preloadImageElement(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timeout = setTimeout(() => {
          img.onload = null;
          img.onerror = null;
          resolve(null);
        }, 7000);

        img.onload = () => {
          clearTimeout(timeout);
          if (img.naturalWidth >= 32 && img.naturalHeight >= 32) {
            resolve(img);
          } else {
            resolve(null);
          }
        };
        img.onerror = () => {
          clearTimeout(timeout);
          resolve(null);
        };
        img.src = src;
      });
    }

    function inferEraFromText(extract, fallbackIdx = 0) {
      if (!extract) {
        const eras = ['Golden Era', 'Classic / 80s-90s', 'Modern / 2000s+'];
        return eras[fallbackIdx % eras.length];
      }
      const years = extract.match(/\b(19\d{2}|20\d{2})\b/g);
      if (years && years.length > 0) {
        const numericYears = years.map(Number).filter((y) => y >= 1915 && y <= 2026);
        const firstYear = numericYears[0];
        if (firstYear) {
          const estimatedPeak = firstYear < 1985 ? firstYear + 24 : firstYear;
          if (estimatedPeak < 1975) return 'Golden Era';
          if (estimatedPeak < 2000) return 'Classic / 80s-90s';
          return 'Modern / 2000s+';
        }
      }
      return 'Modern / 2000s+';
    }

    function inferDecadeGroup(star, fallbackIdx = 0) {
      const bornMatch = star.born && star.born.match(/\b(18\d{2}|19\d{2}|20\d{2})\b/);
      if (bornMatch) {
        const peakYear = Number(bornMatch[1]) + 26;
        if (peakYear < 1960) return '1920s–1950s';
        if (peakYear < 1980) return '1960s–1970s';
        if (peakYear < 2000) return '1980s–1990s';
        if (peakYear < 2020) return '2000s–2010s';
        return '2020s+';
      }
      if (star.era === 'Golden Era') return fallbackIdx % 2 === 0 ? '1920s–1950s' : '1960s–1970s';
      if (star.era === 'Classic / 80s-90s') return '1980s–1990s';
      const modernBuckets = ['2000s–2010s', '2020s+'];
      return modernBuckets[fallbackIdx % modernBuckets.length];
    }

    // Extract real awards from Wikipedia summary text or curated lookup
    function extractExactAwards(name, wikiTitle, extractText, industry) {
      const keyName = (name || '').toLowerCase().trim();
      const keyWiki = (wikiTitle || '').toLowerCase().trim();
      if (EXACT_AWARDS_LOOKUP[keyName]) return EXACT_AWARDS_LOOKUP[keyName];
      if (EXACT_AWARDS_LOOKUP[keyWiki]) return EXACT_AWARDS_LOOKUP[keyWiki];

      if (extractText) {
        const patterns = [
          /Academy Award[s]?/gi,
          /Oscar[s]?/gi,
          /National Film Award[s]?/gi,
          /Filmfare Award[s]?/gi,
          /Padma Vibhushan/gi,
          /Padma Bhushan/gi,
          /Padma Shri/gi,
          /Dadasaheb Phalke Award/gi,
          /Bharat Ratna/gi,
          /Golden Globe Award[s]?/gi,
          /BAFTA Award[s]?/gi,
          /Primetime Emmy Award[s]?/gi,
          /Emmy Award[s]?/gi,
          /Tony Award[s]?/gi,
          /Grammy Award[s]?/gi,
          /Screen Actors Guild Award[s]?/gi,
          /Cannes Film Festival/gi,
          /Palme d'Or/gi,
          /IIFA Award[s]?/gi,
          /Zee Cine Award[s]?/gi,
          /Nandi Award[s]?/gi,
          /SIIMA Award[s]?/gi,
          /Laurence Olivier Award[s]?/gi,
          /César Award[s]?/gi
        ];
        const found = [];
        patterns.forEach((rx) => {
          const m = extractText.match(rx);
          if (m && m[0]) {
            const label = m[0].replace(/\b\w/g, (c) => c.toUpperCase());
            if (!found.some((f) => f.toLowerCase() === label.toLowerCase())) {
              found.push(label);
            }
          }
        });
        if (found.length > 0) {
          return found.slice(0, 4).join(', ');
        }
      }

      return industry === 'Bollywood'
        ? 'Filmfare & Indian Cinema Guild Nominee'
        : 'Guild & Screen Critics Nominee';
    }

    // Create high-resolution procedural Planet Earth surface and cloud textures
    function createEarthTextures() {
      const width = 1024;
      const height = 512;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = width;
      colorCanvas.height = height;
      const ctx = colorCanvas.getContext('2d');

      const oceanGrad = ctx.createLinearGradient(0, 0, 0, height);
      oceanGrad.addColorStop(0, '#1e3a8a');
      oceanGrad.addColorStop(0.25, '#0369a1');
      oceanGrad.addColorStop(0.5, '#0284c7');
      oceanGrad.addColorStop(0.75, '#0369a1');
      oceanGrad.addColorStop(1, '#1e3a8a');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < 420; i++) {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(56, 189, 248, 0.08)' : 'rgba(12, 74, 110, 0.12)';
        ctx.beginPath();
        ctx.ellipse(
          Math.random() * width,
          Math.random() * height,
          18 + Math.random() * 55,
          6 + Math.random() * 18,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      const toXY = (lon, lat) => [
        ((lon + 180) / 360) * width,
        ((90 - lat) / 180) * height
      ];

      const drawContinent = (coords, fillStyle, strokeStyle = '#15803d') => {
        ctx.beginPath();
        coords.forEach(([lon, lat], idx) => {
          const [x, y] = toXY(lon, lat);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
      };

      // North America
      drawContinent(
        [
          [-165, 68], [-140, 70], [-110, 74], [-75, 72], [-55, 52],
          [-68, 44], [-80, 26], [-95, 29], [-105, 20], [-85, 10],
          [-92, 16], [-115, 30], [-124, 42], [-138, 58], [-165, 62]
        ],
        '#228b22'
      );

      // South America
      drawContinent(
        [
          [-80, 10], [-62, 10], [-36, -6], [-39, -22], [-54, -34],
          [-68, -54], [-75, -52], [-72, -30], [-81, -5]
        ],
        '#2e8b57'
      );

      // Europe
      drawContinent(
        [
          [-10, 36], [0, 43], [-5, 48], [5, 53], [12, 58], [28, 70],
          [55, 68], [58, 50], [40, 42], [26, 38], [15, 38], [3, 42]
        ],
        '#3b873e'
      );

      // Africa
      drawContinent(
        [
          [-17, 15], [-6, 35], [10, 37], [32, 31], [43, 12], [51, 11],
          [40, -14], [32, -28], [19, -34], [12, -16], [9, 4], [-8, 5]
        ],
        '#65a30d'
      );

      // Asia (including prominent Indian subcontinent)
      drawContinent(
        [
          [28, 42], [55, 50], [65, 68], [105, 74], [145, 70], [175, 65],
          [155, 50], [135, 36], [122, 24], [108, 12], [98, 16], [88, 22],
          [78, 8], [70, 22], [62, 25], [48, 30], [36, 36]
        ],
        '#2f855a'
      );

      // Australia
      drawContinent(
        [
          [114, -22], [130, -12], [142, -11], [153, -27], [148, -38],
          [132, -33], [115, -34]
        ],
        '#84cc16'
      );

      // Greenland
      drawContinent(
        [
          [-52, 60], [-42, 82], [-20, 81], [-22, 68], [-44, 60]
        ],
        '#e2e8f0',
        '#cbd5e1'
      );

      // Desert & Terrain Biome Patches
      const addTerrainPatch = (lon, lat, rx, ry, color) => {
        const [x, y] = toXY(lon, lat);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0.15, 0, Math.PI * 2);
        ctx.fill();
      };
      addTerrainPatch(14, 24, 58, 22, 'rgba(217, 169, 90, 0.72)');
      addTerrainPatch(46, 23, 24, 15, 'rgba(217, 169, 90, 0.7)');
      addTerrainPatch(92, 34, 42, 18, 'rgba(161, 161, 170, 0.55)');
      addTerrainPatch(133, -24, 26, 14, 'rgba(217, 140, 74, 0.65)');
      addTerrainPatch(-112, 40, 22, 26, 'rgba(163, 145, 113, 0.52)');

      // Polar Ice Caps
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, width, 24);
      ctx.fillRect(0, height - 34, width, 34);

      const earthMap = new THREE.CanvasTexture(colorCanvas);
      earthMap.needsUpdate = true;

      // Cloud Layer Texture
      const cloudCanvas = document.createElement('canvas');
      cloudCanvas.width = width;
      cloudCanvas.height = height;
      const cCtx = cloudCanvas.getContext('2d');
      cCtx.clearRect(0, 0, width, height);

      for (let i = 0; i < 360; i++) {
        const cx = Math.random() * width;
        const cy = 35 + Math.random() * (height - 70);
        const rx = 14 + Math.random() * 52;
        const ry = 4 + Math.random() * 14;
        const grad = cCtx.createRadialGradient(cx, cy, 1, cx, cy, rx);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.62)');
        grad.addColorStop(0.6, 'rgba(255, 255, 255, 0.24)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        cCtx.fillStyle = grad;
        cCtx.beginPath();
        cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
        cCtx.fill();
      }

      const cloudMap = new THREE.CanvasTexture(cloudCanvas);
      cloudMap.needsUpdate = true;

      return { earthMap, cloudMap };
    }

    // Create circular framed portrait texture for Three.js Sprite (lightweight 128x128)
    function createStarPortraitTexture(imgEl, industry) {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const borderColor = industry === 'Bollywood' ? '#fbbf24' : '#38bdf8';

      ctx.clearRect(0, 0, size, size);

      // Dark circular base
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 5, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // Clipped circular face portrait
      ctx.save();
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 9, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      if (imgEl) {
        const iw = imgEl.naturalWidth || imgEl.width;
        const ih = imgEl.naturalHeight || imgEl.height;
        const side = Math.min(iw, ih);
        const sx = (iw - side) / 2;
        const sy = Math.max(0, (ih - side) * 0.22);
        ctx.drawImage(imgEl, sx, sy, side, side, 9, 9, size - 18, size - 18);
      }
      ctx.restore();

      // Crisp territory border ring
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 8, 0, Math.PI * 2);
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = borderColor;
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.needsUpdate = true;
      return tex;
    }

    // Create glowing territory orb texture before a star's photo finishes loading
    function createDefaultOrbTexture(industry) {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const coreColor = industry === 'Bollywood' ? '#fde047' : '#7dd3fc';
      const glowColor = industry === 'Bollywood' ? 'rgba(245, 158, 11, 0)' : 'rgba(14, 165, 233, 0)';

      const grad = ctx.createRadialGradient(
        size / 2,
        size / 2,
        2,
        size / 2,
        size / 2,
        size / 2 - 2
      );
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.35, coreColor);
      grad.addColorStop(1, glowColor);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      const tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.needsUpdate = true;
      return tex;
    }

    // Compute geographic 3D position around Planet Earth (Bollywood over India/Asia, Hollywood over North America/West)
    function computeGlobePosition(index, total, industry, radius = 10.1) {
      const goldenRatio = (1 + Math.sqrt(5)) / 2;
      const t = (index + 0.5) / Math.max(total, 1);
      const latBand = (t - 0.5) * Math.PI * 0.72;
      const jitter = ((index * 1.6180339) % 1) - 0.5;
      const centerLon = industry === 'Bollywood' ? 1.42 : -1.72;
      const lonSpread = industry === 'Bollywood' ? 2.55 : 2.85;
      const lon =
        centerLon +
        (((index / goldenRatio) % 1) - 0.5) * lonSpread +
        jitter * 0.18;
      const r = radius + (index % 5) * 0.24;
      const cosLat = Math.cos(latBand);
      return new THREE.Vector3(
        r * cosLat * Math.sin(lon),
        r * Math.sin(latBand),
        r * cosLat * Math.cos(lon)
      );
    }

      const playStarChime = useCallback((isBollywood) => {
        try {
          const engine = audioEngineRef.current;
          if (!engine || !engine.isPlaying || !engine.ctx) return;
          const ctx = engine.ctx;
          if (ctx.state === 'suspended') ctx.resume();
          const now = ctx.currentTime;
          const notes = isBollywood ? [523.25, 659.25, 783.99] : [440.0, 554.37, 659.25];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.001, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.035, now + idx * 0.06 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 0.95);
            osc.connect(gain);
            gain.connect(engine.reverbNode || engine.masterGain);
            osc.start(now + idx * 0.06);

                [110.0, 164.81, 220.0, 246.94, 329.63],  // Am9
                [87.31, 130.81, 174.61, 220.0, 329.63],  // Fmaj7

                subOsc.type = 'triangle';

                subOsc.frequency.setValueAtTime(freq * 1.003, ctx.currentTime);

                filter.frequency.setValueAtTime(480, ctx.currentTime);

                osc.connect(filter);
                subOsc.connect(filter);
                filter.connect(voiceGain);
                voiceGain.connect(masterGain);
                voiceGain.connect(delay);

                osc.start();
                subOsc.start();
                return { osc, subOsc };

                const eng = audioEngineRef.current;

                chordIndex = (chordIndex + 1) % chordProgression.length;
                const nextChord = chordProgression[chordIndex];
                const now = eng.ctx.currentTime;
                padVoices.forEach((voice, i) => {

                osc.type = 'sine';

                gain.connect(delay);

                osc.stop(now + 2.5);

                reverbNode: delay,

          });
        };
        domElem.addEventListener('webglcontextrestored', handleContextRestored);

        // Main Animation Loop
        let animId = null;
        let shipAngle = 0;
        const animate = () => {
          animId = requestAnimationFrame(animate);

          if (autoRotateRef.current && !isDraggingRef.current) {
            globeGroup.rotation.y += 0.0016;
          }

          if (cloudMeshRef.current) {
            cloudMeshRef.current.rotation.y += 0.00055;
          }

          // Orbit Asteroids
          for (let i = 0; i < asteroids.length; i++) {
            const a = asteroids[i];
            a.angle += a.speed;
            a.mesh.position.x = Math.cos(a.angle) * a.orbitRadius;
            a.mesh.position.z = Math.sin(a.angle) * a.orbitRadius;
            a.mesh.rotation.x += a.rotSpeed;
            a.mesh.rotation.y += a.rotSpeed;
          }

          // Orbit Twin "ALL STARS" Spaceships
          shipAngle += 0.0075;
          bollywoodShip.position.set(
            Math.cos(shipAngle) * 13.6,
            Math.sin(shipAngle * 2) * 1.4,
            Math.sin(shipAngle) * 13.6
          );
          bollywoodShip.lookAt(
            Math.cos(shipAngle + 0.1) * 13.6,
            Math.sin((shipAngle + 0.1) * 2) * 1.4,
            Math.sin(shipAngle + 0.1) * 13.6
          );

          const oppAngle = shipAngle + Math.PI;
          hollywoodShip.position.set(
            Math.cos(oppAngle) * 14.5,
            Math.cos(oppAngle * 2) * 1.6,
            Math.sin(oppAngle) * 14.5
          );
          hollywoodShip.lookAt(
            Math.cos(oppAngle + 0.1) * 14.5,
            Math.cos((oppAngle + 0.1) * 2) * 1.6,
            Math.sin(oppAngle + 0.1) * 14.5
          );

          // Smooth Spherical Camera Interpolation
          const cur = sphericalRef.current;
          const tgt = targetSphericalRef.current;
          cur.radius += (tgt.radius - cur.radius) * 0.1;
          cur.theta += (tgt.theta - cur.theta) * 0.12;
          cur.phi += (tgt.phi - cur.phi) * 0.12;

          camera.position.set(
            cur.radius * Math.sin(cur.phi) * Math.sin(cur.theta),
            cur.radius * Math.cos(cur.phi),
            cur.radius * Math.sin(cur.phi) * Math.cos(cur.theta)
          );
          camera.lookAt(0, 0, 0);

          renderer.render(scene, camera);
        };
        animate();

        return () => {
          if (animId) cancelAnimationFrame(animId);
          domElem.removeEventListener('mousedown', onPointerDown);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('mouseup', onPointerUp);
          domElem.removeEventListener('touchstart', onPointerDown);
          domElem.removeEventListener('touchmove', onPointerMove);
          domElem.removeEventListener('touchend', onPointerUp);
          domElem.removeEventListener('wheel', onWheel);
          window.removeEventListener('resize', handleResize);
          document.removeEventListener('fullscreenchange', handleResize);
          domElem.removeEventListener('webglcontextrestored', handleContextRestored);
          renderer.dispose();
        };
      }, []);

      // ==========================================================================
      // 5. SYNCHRONIZE 3D STAR PORTRAIT SPRITES & FILTER VISIBILITY
      // ==========================================================================
      useEffect(() => {
        const group = starSpritesGroupRef.current;
        const linesGroup = constellationLinesRef.current;
        if (!group) return;

        const filteredWikiSet = new Set(filteredStars.map((s) => s.wiki));
        const bollywoodTotal = stars.filter((s) => s.industry === 'Bollywood').length;
        const hollywoodTotal = stars.filter((s) => s.industry === 'Hollywood').length;

        let bIdx = 0;
        let hIdx = 0;
        let photosReady = 0;

        stars.forEach((star) => {
          const isBollywood = star.industry === 'Bollywood';
          const territoryIdx = isBollywood ? bIdx++ : hIdx++;
          const territoryTotal = isBollywood ? bollywoodTotal : hollywoodTotal;

          let sprite = spritesMapRef.current.get(star.wiki);
          if (!sprite) {
            const orbTex = defaultOrbTexRef.current[star.industry];
            const mat = new THREE.SpriteMaterial({
              map: orbTex,
              transparent: true,
              fog: false,
              depthWrite: false
            });
            sprite = new THREE.Sprite(mat);
            sprite.frustumCulled = false;
            sprite.renderOrder = 2;
            const pos = computeGlobePosition(territoryIdx, territoryTotal, star.industry, 10.1);
            sprite.position.copy(pos);
            sprite.scale.set(0.72, 0.72, 1);
            group.add(sprite);
            spritesMapRef.current.set(star.wiki, sprite);
          }

          sprite.userData.star = star;
          sprite.visible = filteredWikiSet.has(star.wiki);

          if (star.photoUrl) {
            photosReady++;
            const cachedTex = textureCacheRef.current.get(star.wiki);
            if (cachedTex) {
              if (sprite.material.map !== cachedTex) {
                sprite.material.map = cachedTex;
                sprite.material.needsUpdate = true;
              }
              sprite.scale.set(0.95, 0.95, 1);
            } else if (!sprite.userData.loadingTex) {
              sprite.userData.loadingTex = true;
              const cachedImg = imageCacheRef.current.get(star.photoUrl);
              const applyImgTexture = (imgEl) => {
                if (!imgEl) return;
                imageCacheRef.current.set(star.photoUrl, imgEl);
                const portraitTex = createStarPortraitTexture(imgEl, star.industry);
                textureCacheRef.current.set(star.wiki, portraitTex);
                sprite.material.map = portraitTex;
                sprite.material.needsUpdate = true;
                sprite.scale.set(0.95, 0.95, 1);
              };

              if (cachedImg) {
                applyImgTexture(cachedImg);
              } else {
                preloadImageElement(star.photoUrl).then(applyImgTexture);
              }
            }
          }
        });

        loadedPhotosCountRef.current = photosReady;
        const photoCounterEl = document.getElementById('photo-counter');
        if (photoCounterEl) {
          photoCounterEl.textContent = photosReady.toLocaleString();
        }

        // Update Constellation Lines
        if (linesGroup) {
          while (linesGroup.children.length > 0) {
            const child = linesGroup.children[0];
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
            linesGroup.remove(child);
          }

          if (showConstellations) {
            ['Bollywood', 'Hollywood'].forEach((ind) => {
              const visibleSprites = filteredStars
                .filter((s) => s.industry === ind)
                .slice(0, 65)
                .map((s) => spritesMapRef.current.get(s.wiki))
                .filter(Boolean);

              if (visibleSprites.length > 1) {
                const pts = [];
                for (let i = 0; i < visibleSprites.length - 1; i++) {
                  pts.push(visibleSprites[i].position.clone());
                  pts.push(visibleSprites[i + 1].position.clone());
                }
                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                const lineMat = new THREE.LineBasicMaterial({
                  color: ind === 'Bollywood' ? 0xfbbf24 : 0x38bdf8,
                  transparent: true,
                  opacity: 0.22
                });
                linesGroup.add(new THREE.LineSegments(lineGeo, lineMat));
              }
            });
          }
        }
      }, [stars, filteredStars, showConstellations]);

      // ==========================================================================
      // 6. HYDRATE SEED STARS & EXPAND TO 1,002 VERIFIED STARS VIA WIKIPEDIA API
      // ==========================================================================
      useEffect(() => {
        let cancelled = false;

        const fetchWikiThumbnails = async (titles) => {
          const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=240&pilimit=max&redirects=1&titles=${encodeURIComponent(
            titles.join('|')
          )}`;
          const res = await fetch(url);
          if (!res.ok) return {};
          const data = await res.json();
          const pages = data?.query?.pages ? Object.values(data.query.pages) : [];
          const normalizedMap = {};
          (data?.query?.normalized || []).forEach((n) => {
            normalizedMap[n.to] = n.from;
          });
          (data?.query?.redirects || []).forEach((r) => {
            normalizedMap[r.to] = normalizedMap[r.from] || r.from;
          });

          const thumbByTitle = {};
          pages.forEach((p) => {
            if (p.thumbnail && isValidPhotoUrl(p.thumbnail.source)) {
              thumbByTitle[p.title.toLowerCase()] = p.thumbnail.source;
              const orig = normalizedMap[p.title];
              if (orig) thumbByTitle[orig.toLowerCase()] = p.thumbnail.source;
            }
          });
          return thumbByTitle;
        };

        const fetchCategoryMembers = async (categoryTitle, limit = 220) => {
          const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=categorymembers&cmtitle=${encodeURIComponent(
            categoryTitle
          )}&cmtype=page&cmnamespace=0&cmlimit=${limit}`;
          const res = await fetch(url);
          if (!res.ok) return [];
          const data = await res.json();
          return (data?.query?.categorymembers || [])
            .map((m) => m.title)
            .filter(
              (t) =>
                t &&
                !t.startsWith('List of') &&
                !t.includes('filmography') &&
                !t.includes('Awards')
            );
        };

        const hydrateAndExpandStars = async () => {
          // 1. Hydrate Curated Seed Stars
          let fullRoster = CURATED_STARS.map((s, idx) => ({
            ...s,
            decade: inferDecadeGroup(s, idx),
            photoUrl: null,
            bio: `Legendary ${s.industry} figure celebrated in the ${s.era} constellation of Dheeraj's Cinema Galaxy.`
          }));

          for (let i = 0; i < fullRoster.length; i += 25) {
            if (cancelled) return;
            const batch = fullRoster.slice(i, i + 25);
            try {
              const thumbs = await fetchWikiThumbnails(batch.map((b) => b.wiki));
              fullRoster = fullRoster.map((item) => {
                const found =
                  thumbs[item.wiki.toLowerCase()] || thumbs[item.name.toLowerCase()];
                return found ? { ...item, photoUrl: found } : item;
              });
              if (!cancelled) setStars([...fullRoster]);
            } catch {}
          }

          // 2. Build Expanded Candidate Queue (Manual Expansion Seeds + Live Wikipedia Categories)
          const seenWikis = new Set(fullRoster.map((s) => s.wiki.toLowerCase()));
          const candidateQueue = [];

          EXPANSION_SEEDS.forEach((seed) => {
            if (!seenWikis.has(seed.wiki.toLowerCase())) {
              seenWikis.add(seed.wiki.toLowerCase());
              candidateQueue.push(seed);
            }
          });

          const categories = [
            { title: 'Category:Hindi-language_film_actors', industry: 'Bollywood' },
            { title: 'Category:Hindi-language_film_actresses', industry: 'Bollywood' },
            { title: 'Category:20th-century_Indian_actors', industry: 'Bollywood' },
            { title: 'Category:20th-century_Indian_actresses', industry: 'Bollywood' },
            { title: 'Category:21st-century_Indian_actors', industry: 'Bollywood' },
            { title: 'Category:21st-century_Indian_actresses', industry: 'Bollywood' },
            { title: 'Category:Actresses_in_Hindi_cinema', industry: 'Bollywood' },
            { title: 'Category:Actors_in_Hindi_cinema', industry: 'Bollywood' },
            { title: 'Category:Indian_film_directors', industry: 'Bollywood' },
            { title: 'Category:Filmfare_Awards_winners', industry: 'Bollywood' },
            { title: 'Category:American_film_actors', industry: 'Hollywood' },
            { title: 'Category:American_film_actresses', industry: 'Hollywood' },
            { title: 'Category:20th-century_American_actors', industry: 'Hollywood' },
            { title: 'Category:20th-century_American_actresses', industry: 'Hollywood' },
            { title: 'Category:21st-century_American_actors', industry: 'Hollywood' },
            { title: 'Category:21st-century_American_actresses', industry: 'Hollywood' },
            { title: 'Category:Best_Actor_Academy_Award_winners', industry: 'Hollywood' },
            { title: 'Category:Best_Actress_Academy_Award_winners', industry: 'Hollywood' },
            { title: 'Category:British_film_actors', industry: 'Hollywood' },
            { title: 'Category:British_film_actresses', industry: 'Hollywood' }
          ];

          const catResults = await Promise.all(
            categories.map(async (cat) => {
              try {
                const titles = await fetchCategoryMembers(cat.title, 220);
                return titles.map((t) => ({
                  name: t.replace(/\s*\(.*?\)\s*/g, '').trim(),
                  industry: cat.industry,
                  wiki: t
                }));
              } catch {
                return [];
              }
            })
          );

          // Interleave Bollywood and Hollywood candidates evenly
          const maxLen = Math.max(...catResults.map((arr) => arr.length), 0);
          for (let idx = 0; idx < maxLen; idx++) {
            for (let c = 0; c < catResults.length; c++) {
              const cand = catResults[c][idx];
              if (cand && !seenWikis.has(cand.wiki.toLowerCase())) {
                seenWikis.add(cand.wiki.toLowerCase());
                candidateQueue.push(cand);
              }
            }
          }

          // 3. Process Candidate Batches until TARGET_TOTAL (1,002) Stars with Verified Photos are Loaded
          for (
            let i = 0;
            i < candidateQueue.length && fullRoster.length < TARGET_TOTAL;
            i += 35
          ) {
            if (cancelled) return;
            const slice = candidateQueue.slice(i, i + 35);
            try {
              const thumbs = await fetchWikiThumbnails(slice.map((c) => c.wiki));
              const newlyAdded = [];

              slice.forEach((c, sIdx) => {
                if (fullRoster.length + newlyAdded.length >= TARGET_TOTAL) return;
                const thumbUrl =
                  thumbs[c.wiki.toLowerCase()] || thumbs[c.name.toLowerCase()];
                if (!isValidPhotoUrl(thumbUrl)) return;

                const era = inferEraFromText('', fullRoster.length + newlyAdded.length);
                const exactAwards = extractExactAwards(c.name, c.wiki, '', c.industry);
                const candidateObj = {
                  name: c.name,
                  industry: c.industry,
                  era,
                  decade: inferDecadeGroup({ era }, fullRoster.length + newlyAdded.length + sIdx),
                  epithet:
                    c.industry === 'Bollywood'
                      ? 'Indian Cinema Luminary'
                      : 'Hollywood Screen Icon',
                  born: 'Cinema Archive',
                  died: null,
                  awards: exactAwards,
                  movies: ['Classic Feature', 'Acclaimed Drama', 'Box Office Hit', 'Signature Role'],
                  wiki: c.wiki,
                  photoUrl: thumbUrl,
                  bio: `Celebrated ${c.industry} artist featured in the ${era} territory of Dheeraj's Cinema Galaxy.`
                };
                newlyAdded.push(candidateObj);
              });

              if (newlyAdded.length > 0 && !cancelled) {
                fullRoster.push(...newlyAdded);
                setStars([...fullRoster]);
                const starCounterEl = document.getElementById('star-counter');
                const expansionEl = document.getElementById('expansion-progress');
                if (starCounterEl) starCounterEl.textContent = fullRoster.length.toLocaleString();
                if (expansionEl && fullRoster.length < TARGET_TOTAL) {
                  expansionEl.textContent = `(Loading 1000+ stars: ${fullRoster.length}/${TARGET_TOTAL}...)`;
                } else if (expansionEl) {
                  expansionEl.textContent = '(1,002/1,002 Stars Loaded ✓)';
                }
              }
            } catch {}
          }
        };

        hydrateAndExpandStars();
        return () => {
          cancelled = true;
        };
      }, []);

      // ==========================================================================
      // 7. RENDER INTERACTIVE UI & 3D EARTH CANVAS
      // ==========================================================================
      return (
        <div className="relative w-full h-full overflow-hidden bg-slate-950">
          {/* 3D WebGL Canvas Container */}
          <div id="globe-canvas-container" ref={containerRef} className="absolute inset-0 z-0" />

          {/* TOP CASINO MARQUEE HEADER & CONTROLS */}
          <header className="fixed top-0 left-0 right-0 z-30 pointer-events-none px-3 sm:px-6 pt-3 sm:pt-4">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2.5">
              {/* Marquee Brand Card */}
              <div className="pointer-events-auto glass-panel rounded-2xl px-3.5 py-2.5 flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 via-yellow-500 to-amber-700 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-black text-lg">
                  🌍
                </div>
                <div>
                  <div className="h-1.5 w-full marquee-dots mb-0.5 rounded-full opacity-80" />
                  <h1 className="text-base sm:text-xl font-extrabold tracking-wider casino-bullet-text leading-tight">
                    DHEERAJ&apos;S CINEMA GALAXY
                  </h1>
                  <p className="text-[11px] sm:text-xs text-slate-300">
                    Bollywood &amp; Hollywood Earth •{' '}
                    <span id="star-counter" className="text-amber-400 font-bold">
                      {stars.length.toLocaleString()}
                    </span>{' '}
                    Stars
                    <span
                      id="expansion-progress"
                      className="text-amber-300/90 font-medium ml-1"
                    ></span>
                    <span className="text-emerald-400 font-semibold ml-1">
                      • <span id="photo-counter">0</span> Photos
                    </span>
                  </p>
                </div>
              </div>

              {/* Action Controls Bar */}
              <div className="pointer-events-auto flex flex-wrap items-center gap-1.5 sm:gap-2">
                {/* Territory Filter Pills */}
                <div className="glass-panel rounded-xl p-1 flex items-center gap-1">
                  {['All', 'Bollywood', 'Hollywood'].map((terr) => {
                    const active = industryFilter === terr;
                    return (
                      <button
                        key={terr}
                        onClick={() => setIndustryFilter(terr)}
                        className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition ${
                          active
                            ? terr === 'Bollywood'
                              ? 'bg-amber-500 text-slate-950 shadow-md'
                              : terr === 'Hollywood'
                              ? 'bg-sky-400 text-slate-950 shadow-md'

                      >
                        {terr === 'Bollywood' ? '🇮🇳 Bollywood' : terr === 'Hollywood' ? '🇺🇸 Hollywood' : '✨ All'}

                </div>

                {/* Decade / Year Quick Selector */}
                <select

                  <option value="2020s+">🚀 2020s+</option>
                </select>

                {/* Legacy & Honours Quick Selector */}
                <select
                  value={honourFilter}
                  onChange={(e) => setHonourFilter(e.target.value)}
                  aria-label="Filter by Honours and Legacy"
                  className="glass-panel rounded-xl px-2.5 py-2 text-xs font-bold text-sky-200 bg-slate-900/90 focus:outline-none focus:border-sky-400 cursor-pointer hidden sm:block"
                >

                {/* Exact Award Quick Selector */}
                <select

                  className="glass-panel rounded-xl px-2.5 py-2 text-xs font-bold text-emerald-200 bg-slate-900/90 focus:outline-none focus:border-emerald-400 cursor-pointer"
                >
                  <option value="All">🏆 Exact Award: All</option>

                  <option value="Filmfare Award">🎬 Filmfare Award</option>

                  <option value="Golden Globe">🌐 Golden Globe</option>
                  <option value="BAFTA">🎭 BAFTA Award</option>
                  <option value="Emmy / Tony">📺 Emmy / Tony Award</option>
                </select>

                {activeFilterCount > 0 && (
                  <button
                    onClick={handleResetFilters}
                    className="px-2.5 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 border border-rose-400/50 text-rose-200 font-bold text-xs transition"
                    title="Clear all active filters"
                  >
                    ✕ Clear ({activeFilterCount})
                  </button>
                )}

                {/* Inspect Featured Star */}
                <button
                  onClick={() => handleSelectStar(filteredStars[0] || stars[0])}
                  className="px-3 py-2 rounded-xl bg-amber-500/25 hover:bg-amber-500/35 border border-amber-400/60 text-amber-200 font-bold text-xs flex items-center gap-1.5 transition shadow-md"
                >
                  <span>⭐ Inspect Star</span>
                </button>

                {/* Auto-Orbit Toggle */}
                <button
                  onClick={() => setAutoRotate((v) => !v)}
                  className={`glass-pill px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 ${
                    autoRotate ? 'border-emerald-400/50 text-emerald-300' : 'text-slate-300'
                  }`}
                >
                  <span>{autoRotate ? '🌍 Orbit: ON' : '⏸️ Orbit: OFF'}</span>
                </button>

                {/* Soothing Cosmic Galaxy Music Toggle */}
                <button
                  onClick={toggleCosmicAudio}
                  className={`glass-pill px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 ${
                    audioPlaying
                      ? 'border-purple-400/70 bg-purple-500/20 text-purple-200 shadow-md shadow-purple-500/20'
                      : 'text-slate-300'
                  }`}
                  title="Play Soothing Copyright-Free Space Galaxy Ambient Music"
                >
                  <span>{audioPlaying ? '🎵 Galaxy Music: ON' : '🔇 Galaxy Music'}</span>
                </button>

                {/* Constellation Links Toggle */}
                <button
                  onClick={() => setShowConstellations((v) => !v)}
                  className={`glass-pill px-3 py-2 rounded-xl text-xs font-semibold hidden md:flex items-center gap-1.5 ${
                    showConstellations ? 'border-amber-400/50 text-amber-200' : 'text-slate-400'
                  }`}
                >
                  <span>✨ Links</span>
                </button>

                {/* Star Directory Drawer Button */}
                <button
                  onClick={() => setDirectoryOpen((v) => !v)}
                  className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/25 transition"
                >
                  <span>🔭 Directory ({filteredStars.length})</span>
                </button>
              </div>
            </div>
          </header>

          {/* HOVER TOOLTIP PILL */}
          {hoveredStar && !selectedStar && (
            <div
              style={{
                left: Math.min(window.innerWidth - 230, hoverPos.x + 14),
                top: Math.max(80, hoverPos.y - 24)
              }}
              className="fixed z-20 pointer-events-none glass-panel rounded-xl px-3 py-2 flex items-center gap-2.5 shadow-xl"
            >
              {hoveredStar.photoUrl ? (
                <img
                  src={hoveredStar.photoUrl}
                  alt={hoveredStar.name}
                  className="w-8 h-8 rounded-full object-cover border border-amber-400"
                />
              ) : (
                <div className="w-8 h-8 rounded-full bg-amber-500/25 border border-amber-400 flex items-center justify-center text-xs font-bold text-amber-300">
                  {hoveredStar.name.charAt(0)}
                </div>
              )}
              <div>
                <div className="text-xs font-extrabold text-white">{hoveredStar.name}</div>
                <div className="text-[10px] text-amber-300 font-medium">
                  {hoveredStar.industry} • Click to inspect
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM-LEFT ZOOM SLIDER HUD */}
          <div className="fixed bottom-4 left-4 z-30 glass-panel rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
            <span className="text-[11px] font-bold text-amber-300 uppercase tracking-wider">
              Zoom
            </span>
            <button
              onClick={() => handleZoomSliderChange(zoomLevel - 10)}
              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm flex items-center justify-center border border-slate-600/60"
              aria-label="Zoom Out"
            >
              −
            </button>
            <input
              type="range"
              min="0"
              max="100"
              value={zoomLevel}
              onChange={(e) => handleZoomSliderChange(e.target.value)}
              className="w-24 sm:w-32 accent-amber-400 cursor-pointer"
              aria-label="Zoom Level"
            />
            <button
              onClick={() => handleZoomSliderChange(zoomLevel + 10)}
              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm flex items-center justify-center border border-slate-600/60"
              aria-label="Zoom In"
            >
              +
            </button>
            <span className="text-xs font-extrabold text-white w-9 text-right">{zoomLevel}%</span>
            <button
              onClick={handleResetCamera}
              className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-amber-300 border border-slate-600/60"
            >
              Reset
            </button>
          </div>

          {/* SEARCHABLE DIRECTORY DRAWER */}
          {directoryOpen && (
            <aside className="fixed top-20 right-3 sm:right-6 bottom-4 z-40 w-[calc(100vw-1.5rem)] sm:w-96 glass-panel rounded-3xl flex flex-col overflow-hidden shadow-2xl">
              <div className="px-4 py-3.5 border-b border-slate-800 flex items-center justify-between">
                <div>
                  <h2 className="text-sm font-extrabold text-amber-300 tracking-wide">
                    🔭 CINEMA STAR DIRECTORY
                  </h2>
                  <p className="text-[11px] text-slate-400">
                    Showing {filteredStars.length.toLocaleString()} of {stars.length.toLocaleString()} stars
                  </p>
                </div>
                <button
                  onClick={() => setDirectoryOpen(false)}
                  className="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center"
                >
                  ✕
                </button>
              </div>

              <div className="p-3 space-y-2.5 border-b border-slate-800">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search actor, award, epithet, or movie..."
                  className="w-full px-3 py-2 rounded-xl bg-slate-900/90 border border-slate-700 focus:border-amber-400 focus:outline-none text-xs text-white placeholder-slate-400"
                />

                {/* Era Filter Pills */}
                <div>
                  <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                    Cinema Era
                  </div>
                  <div className="flex gap-1 overflow-x-auto pb-0.5">
                    {['All', 'Golden Era', 'Classic / 80s-90s', 'Modern / 2000s+'].map((era) => (
                      <button
                        key={era}
                        onClick={() => setEraFilter(era)}
                        className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold whitespace-nowrap transition ${
                          eraFilter === era
                            ? 'bg-amber-400 text-slate-950 font-bold'
                            : 'bg-slate-800/80 text-slate-300 hover:text-white'
                        }`}
                      >
                        {era}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Decade / Year Filter Pills */}
                <div>
                  <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                    Decade / Years
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {['All', '1920s–1950s', '1960s–1970s', '1980s–1990s', '2000s–2010s', '2020s+'].map(
                      (dec) => (
                        <button
                          key={dec}
                          onClick={() => setDecadeFilter(dec)}
                          className={`px-2 py-1 rounded-lg text-[10px] font-semibold transition ${
                            decadeFilter === dec
                              ? 'bg-sky-400 text-slate-950 font-bold'
                              : 'bg-slate-800/80 text-slate-300 hover:text-white'
                          }`}
                        >
                          {dec === 'All' ? 'All Years' : dec}
                        </button>
                      )
                    )}
                  </div>
                </div>

                {/* Honours & Legacy Filter Pills */}
                <div>
                  <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                    Legacy &amp; Status
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {['All', 'Major Winners', 'Living Legends', 'In Memoriam'].map((hon) => (
                      <button
                        key={hon}
                        onClick={() => setHonourFilter(hon)}
                        className={`px-2 py-1 rounded-lg text-[10px] font-semibold transition ${
                          honourFilter === hon
                            ? 'bg-emerald-400 text-slate-950 font-bold'
                            : 'bg-slate-800/80 text-slate-300 hover:text-white'
                        }`}
                      >
                        {hon}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Exact Award Filter Pills */}
                <div>
                  <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                    Exact Awards Won
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {[
                      { id: 'All', label: 'All Awards' },
                      { id: 'Oscar', label: '🏆 Oscar' },
                      { id: 'National Film Award', label: '🇮🇳 National' },
                      { id: 'Filmfare Award', label: '🎬 Filmfare' },
                      { id: 'Padma / Phalke', label: '🎖️ Padma / Phalke' },
                      { id: 'Golden Globe', label: '🌐 Golden Globe' },
                      { id: 'BAFTA', label: '🎭 BAFTA' },
                      { id: 'Emmy / Tony', label: '📺 Emmy / Tony' }
                    ].map((aw) => (
                      <button
                        key={aw.id}
                        onClick={() => setExactAwardFilter(aw.id)}
                        className={`px-2 py-1 rounded-lg text-[10px] font-semibold transition ${
                          exactAwardFilter === aw.id
                            ? 'bg-amber-400 text-slate-950 font-bold'
                            : 'bg-slate-800/80 text-slate-300 hover:text-white'
                        }`}
                      >
                        {aw.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto cinema-scroll p-2.5 space-y-1.5">
                {filteredStars.map((s) => (
                  <button
                    key={s.wiki}
                    onClick={() => {
                      handleSelectStar(s);
                      if (window.innerWidth < 640) setDirectoryOpen(false);
                    }}
                    className={`w-full text-left p-2.5 rounded-xl border transition flex items-center gap-3 ${
                      selectedStar && selectedStar.wiki === s.wiki
                        ? 'bg-amber-500/20 border-amber-400'
                        : 'bg-slate-900/60 hover:bg-slate-800/80 border-slate-800'
                    }`}
                  >
                    {s.photoUrl ? (
                      <img
                        src={s.photoUrl}
                        alt={s.name}
                        className="w-10 h-10 rounded-full object-cover border border-amber-400/60 shrink-0"
                      />
                    ) : (
                      <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-extrabold text-amber-300 shrink-0">
                        {s.name.charAt(0)}
                      </div>
                    )}
                    <div className="min-w-0 flex-1">
                      <div className="text-xs font-bold text-white truncate">{s.name}</div>
                      <div className="text-[11px] text-slate-400 truncate">{s.epithet}</div>
                      <div className="flex items-center gap-1.5 mt-0.5">
                        <span
                          className={`text-[10px] font-bold px-1.5 py-0.2 rounded ${
                            s.industry === 'Bollywood'
                              ? 'bg-amber-500/20 text-amber-300'
                              : 'bg-sky-500/20 text-sky-300'
                          }`}
                        >
                          {s.industry}
                        </span>
                        <span className="text-[10px] text-slate-500">{s.era}</span>
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            </aside>
          )}

          {/* COMPLETE SCROLLABLE STAR DOSSIER MODAL CARD */}
          {selectedStar && (
            <div
              onClick={handleCloseStarCard}
              className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-3 sm:p-6"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-xl max-h-[88vh] overflow-y-auto cinema-scroll bg-slate-900 border-2 border-amber-400/50 rounded-3xl shadow-2xl p-5 sm:p-6 text-white relative"
              >
                {/* Top Navigation & Close Row */}
                <div className="flex items-center justify-between gap-2 pb-4 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleNavigateStar(-1)}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700"
                    >
                      ← Prev
                    </button>
                    <button
                      onClick={() => handleNavigateStar(1)}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700"
                    >
                      Next →
                    </button>
                  </div>
                  <button
                    onClick={handleCloseStarCard}
                    className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-rose-500/25 hover:text-rose-300 border border-slate-700 text-slate-200 font-extrabold flex items-center justify-center transition"
                    aria-label="Close Dossier"
                  >
                    ✕
                  </button>
                </div>

                {/* Portrait & Title Header */}
                <div className="flex flex-col sm:flex-row items-center sm:items-start gap-4 mt-4">
                  {selectedStar.photoUrl ? (
                    <img
                      src={selectedStar.photoUrl}
                      alt={selectedStar.name}
                      className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover border-2 border-amber-400 shadow-lg shrink-0"
                    />
                  ) : (
                    <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-gradient-to-br from-amber-500/30 to-sky-500/30 border-2 border-amber-400 flex items-center justify-center text-3xl font-black text-amber-300 shrink-0">
                      {selectedStar.name.charAt(0)}
                    </div>
                  )}

                  <div className="text-center sm:text-left flex-1">
                    <div className="flex flex-wrap items-center justify-center sm:justify-start gap-2 mb-1.5">
                      <span
                        className={`px-2.5 py-0.5 rounded-full text-xs font-extrabold ${
                          selectedStar.industry === 'Bollywood'
                            ? 'bg-amber-400 text-slate-950'
                            : 'bg-sky-400 text-slate-950'
                        }`}
                      >
                        {selectedStar.industry}
                      </span>
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-800 text-amber-200 border border-slate-700">
                        {selectedStar.era}
                      </span>
                    </div>

                    <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight">
                      {selectedStar.name}
                    </h2>
                    <p className="text-sm font-semibold text-amber-300 mt-0.5">
                      {selectedStar.epithet}
                    </p>
                  </div>
                </div>

                {/* Lifespan & Awards Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5">
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                      📅 Born &amp; Lifespan
                    </div>
                    <div className="text-sm font-bold text-white mt-1">
                      Born: {selectedStar.born}
                    </div>
                    <div className="text-xs text-slate-300 mt-0.5">
                      {selectedStar.died ? `Passed: ${selectedStar.died}` : 'Living Cinema Legend'}
                    </div>
                  </div>

                  <div className="bg-amber-500/10 border border-amber-400/40 rounded-2xl p-3.5">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-amber-300">
                      🏆 Awards &amp; Honours
                    </div>
                    <div className="text-sm font-bold text-white mt-1 leading-snug">
                      {selectedStar.awards}
                    </div>
                  </div>
                </div>

                {/* Signature Credits */}
                <div className="mt-4 bg-slate-800/60 border border-slate-700/70 rounded-2xl p-3.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-sky-300 mb-2">
                    🎬 Signature Films &amp; Credits
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {selectedStar.movies.map((movie, idx) => (
                      <span
                        key={idx}
                        className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-xs font-semibold text-slate-100"
                      >
                        {movie}
                      </span>
                    ))}
                  </div>
                </div>

                {/* Full Biography */}
                <div className="mt-4 bg-slate-800/60 border border-slate-700/70 rounded-2xl p-4">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 mb-1.5">
                    📖 Cinema Biography
                  </div>
                  <p className="text-sm text-slate-200 leading-relaxed whitespace-pre-line">
                    {liveBioCache[selectedStar.wiki] || selectedStar.bio}
                  </p>
                </div>

                {/* Footer Actions */}
                <div className="mt-5 pt-4 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <a
                    href={`https://en.wikipedia.org/wiki/${encodeURIComponent(selectedStar.wiki)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs transition shadow-md"
                  >
                    Read Full Wikipedia Article ↗
                  </a>
                  <button
                    onClick={handleCloseStarCard}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700"
                  >
                    Resume Earth Orbit
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CinemaGalaxyApp />);
  </script>
</body>
</html>
