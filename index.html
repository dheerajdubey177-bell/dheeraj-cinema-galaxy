    // ============================================================================
    function isValidPhotoUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const lower = url.toLowerCase();
      if (!lower.startsWith('http')) return false;
      if (
        lower.endsWith('.svg') ||
        lower.includes('placeholder') ||
        lower.includes('no_image') ||
        lower.includes('question_book') ||
        lower.includes('ambox') ||
        lower.includes('commons-logo')
      ) {
        return false;
      }
      return true;
    }

    function preloadImageElement(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timeout = setTimeout(() => {
          img.onload = null;
          img.onerror = null;
          resolve(null);
        }, 7000);

        img.onload = () => {
          clearTimeout(timeout);
          if (img.naturalWidth >= 40 && img.naturalHeight >= 40) {
            resolve(img);
          } else {
            resolve(null);
          }
        };
        img.onerror = () => {
          clearTimeout(timeout);
          resolve(null);
        };
        img.src = src;
      });
    }

    function inferEraFromText(extract, fallbackIdx = 0) {
      if (!extract) {
        const eras = ['Golden Era', 'Classic / 80s-90s', 'Modern / 2000s+'];
        return eras[fallbackIdx % eras.length];
      }
      const years = extract.match(/\b(19\d{2}|20\d{2})\b/g);
      if (years && years.length > 0) {
        const numericYears = years.map(Number).filter((y) => y >= 1915 && y <= 2026);
        const firstYear = numericYears[0];
        if (firstYear) {
          const estimatedPeak = firstYear < 1985 ? firstYear + 24 : firstYear;
          if (estimatedPeak < 1975) return 'Golden Era';
          if (estimatedPeak < 2000) return 'Classic / 80s-90s';
          return 'Modern / 2000s+';
        }
      }
      return 'Modern / 2000s+';
    }

    // Deterministic spherical placement grouped by Bollywood (India / South Asia) & Hollywood (North America)
    function computeGlobePosition(index, totalInTerritory, industry, radius = 10) {
      const total = Math.max(totalInTerritory, 501);
      const shellRadius = radius + (index % 5) * 0.28 + Math.floor(index / 120) * 0.35;

      const centerLatDeg = industry === 'Bollywood' ? 21 : 35;
      const centerLonDeg = industry === 'Bollywood' ? 78 : -105;

      const t = (index + 0.5) / total;
      const spreadFactor = Math.pow(t, 0.62);
      const goldenAngle = index * 2.39996323;

      const latOffset = Math.sin(goldenAngle) * spreadFactor * 72;
      const lonOffset = Math.cos(goldenAngle) * spreadFactor * 105;

      const latDeg = Math.max(-76, Math.min(78, centerLatDeg + latOffset));
      const lonDeg = centerLonDeg + lonOffset;

      const lat = THREE.MathUtils.degToRad(latDeg);
      const lon = THREE.MathUtils.degToRad(lonDeg);

      return new THREE.Vector3(
        shellRadius * Math.cos(lat) * Math.cos(lon),
        shellRadius * Math.sin(lat),
        shellRadius * Math.cos(lat) * Math.sin(lon)
      );
    }

    // Create high-resolution procedural Planet Earth surface and cloud textures
    function createEarthTextures() {
      const width = 1024;
      const height = 512;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = width;
      colorCanvas.height = height;
      const ctx = colorCanvas.getContext('2d');

      const oceanGrad = ctx.createLinearGradient(0, 0, 0, height);
      oceanGrad.addColorStop(0, '#1e3a8a');
      oceanGrad.addColorStop(0.25, '#0369a1');
      oceanGrad.addColorStop(0.5, '#0284c7');
      oceanGrad.addColorStop(0.75, '#0369a1');
      oceanGrad.addColorStop(1, '#1e3a8a');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < 420; i++) {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(56, 189, 248, 0.08)' : 'rgba(12, 74, 110, 0.12)';
        ctx.beginPath();
        ctx.ellipse(
          Math.random() * width,
          Math.random() * height,
          18 + Math.random() * 55,
          6 + Math.random() * 18,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      const toXY = (lon, lat) => [
        ((lon + 180) / 360) * width,
        ((90 - lat) / 180) * height
      ];

      const drawContinent = (coords, fillStyle, strokeStyle = '#15803d') => {
        ctx.beginPath();
        coords.forEach(([lon, lat], idx) => {
          const [x, y] = toXY(lon, lat);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
      };

      // North America
      drawContinent(
        [
          [-165, 68], [-140, 70], [-110, 74], [-75, 72], [-55, 52],
          [-68, 44], [-80, 26], [-95, 29], [-105, 20], [-85, 10],
          [-92, 16], [-115, 30], [-124, 42], [-138, 58], [-165, 62]
        ],
        '#228b22'
      );

      // South America
      drawContinent(
        [
          [-80, 10], [-62, 10], [-36, -6], [-39, -22], [-54, -34],
          [-68, -54], [-75, -52], [-72, -30], [-81, -5]
        ],
        '#2e8b57'
      );

      // Europe
      drawContinent(
        [
          [-10, 36], [0, 43], [-5, 48], [5, 53], [12, 58], [28, 70],
          [55, 68], [58, 50], [40, 42], [26, 38], [15, 38], [3, 42]
        ],
        '#3b873e'
      );

      // Africa
      drawContinent(
        [
          [-17, 15], [-6, 35], [10, 37], [32, 31], [43, 12], [51, 11],
          [40, -14], [32, -28], [19, -34], [12, -16], [9, 4], [-8, 5]
        ],
        '#65a30d'
      );

      // Asia (including prominent Indian subcontinent)

    // Create circular framed portrait texture for Three.js Sprite
    function createStarPortraitTexture(imgEl, industry, isSelected = false) {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const borderColor = isSelected
        ? '#ffffff'
        : industry === 'Bollywood'
        ? '#fbbf24'
        : '#38bdf8';

      ctx.clearRect(0, 0, size, size);

      ctx.save();
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 6, 0, Math.PI * 2);
      ctx.shadowColor = borderColor;
      ctx.shadowBlur = isSelected ? 18 : 10;
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 10, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      if (imgEl) {
        const iw = imgEl.naturalWidth || imgEl.width;
        const ih = imgEl.naturalHeight || imgEl.height;
        const side = Math.min(iw, ih);
        const sx = (iw - side) / 2;
        const sy = Math.max(0, (ih - side) * 0.22);
        ctx.drawImage(imgEl, sx, sy, side, side, 10, 10, size - 20, size - 20);
      } else {
        const grad = ctx.createRadialGradient(size / 2, size / 2, 5, size / 2, size / 2, size / 2);
        grad.addColorStop(0, industry === 'Bollywood' ? '#fde047' : '#7dd3fc');
        grad.addColorStop(1, industry === 'Bollywood' ? '#b45309' : '#0369a1');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 9, 0, Math.PI * 2);
      ctx.lineWidth = isSelected ? 6 : 4;
      ctx.strokeStyle = borderColor;
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // Create default glowing star orb texture before photo arrives
    function createDefaultOrbTexture(industry) {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size / 2 - 2);
      if (industry === 'Bollywood') {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.28, '#fde047');
        grad.addColorStop(0.65, 'rgba(245, 158, 11, 0.55)');
        grad.addColorStop(1, 'rgba(245, 158, 11, 0)');
      } else {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.28, '#bae6fd');
        grad.addColorStop(0.65, 'rgba(56, 189, 248, 0.55)');
        grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

      // Procedural Copyright-Free Soothing Cosmic Galaxy & Starlight Synthesizer
      const playStarChime = useCallback((isBollywood = true) => {
        const engine = audioEngineRef.current;
        if (!engine || !engine.ctx || !engine.isPlaying) return;
        try {
          const ctx = engine.ctx;
          const now = ctx.currentTime;
          const notes = isBollywood ? [523.25, 659.25, 783.99, 1046.5] : [440, 554.37, 659.25, 880];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.0001, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.032, now + idx * 0.06 + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 1.1);
            osc.connect(gain);
            gain.connect(engine.masterGain);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 1.15);
          });
        } catch {}
      }, []);

      const toggleCosmicAudio = useCallback(() => {
        try {
          if (!audioEngineRef.current) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            const masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
            masterGain.connect(ctx.destination);

            const padFreqs = [130.81, 164.81, 196.0, 246.94, 293.66];
            const padOscs = padFreqs.map((freq, idx) => {
              const osc = ctx.createOscillator();
              const filter = ctx.createBiquadFilter();
              const oscGain = ctx.createGain();

              osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(freq, ctx.currentTime);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(420, ctx.currentTime);

              oscGain.gain.setValueAtTime(idx === 0 ? 0.14 : 0.075, ctx.currentTime);

              osc.connect(filter);
              filter.connect(oscGain);
              oscGain.connect(masterGain);
              osc.start();
              return { osc, filter, baseFreq: freq };
            });

            const twinkleTimer = setInterval(() => {
              const eng = audioEngineRef.current;
              if (!eng || !eng.isPlaying || eng.ctx.state !== 'running') return;
              const now = eng.ctx.currentTime;
              const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 987.77, 1046.5, 1174.66];
              const freq = scale[Math.floor(Math.random() * scale.length)];

              const starOsc = eng.ctx.createOscillator();
              const starGain = eng.ctx.createGain();
              starOsc.type = 'sine';
              starOsc.frequency.setValueAtTime(freq, now);

              starGain.gain.setValueAtTime(0.0001, now);
              starGain.gain.exponentialRampToValueAtTime(0.022, now + 0.18);
              starGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);

              starOsc.connect(starGain);
              starGain.connect(eng.masterGain);
              starOsc.start(now);
              starOsc.stop(now + 2.5);
            }, 2200);

            audioEngineRef.current = {
              ctx,
              masterGain,
              padOscs,
              twinkleTimer,
              isPlaying: false
            };
          }

          const engine = audioEngineRef.current;
          if (!engine.isPlaying) {
            if (engine.ctx.state === 'suspended') {
              engine.ctx.resume();
            }
            engine.masterGain.gain.cancelScheduledValues(engine.ctx.currentTime);
            engine.masterGain.gain.setTargetAtTime(0.28, engine.ctx.currentTime, 0.8);

        bgStarGeo.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        bgStarGeo.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));
        const bgStarMat = new THREE.PointsMaterial({
          size: 0.42,
          vertexColors: true,
          transparent: true,
          opacity: 0.85
        });
        const bgStars = new THREE.Points(bgStarGeo, bgStarMat);
        scene.add(bgStars);

        // Main Rotating Globe Group
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);
        globeGroupRef.current = globeGroup;

        // 1. Realistic 3D Planet Earth Core
        const { earthMap, cloudMap } = createEarthTextures();
        const earthGeo = new THREE.SphereGeometry(9.35, 64, 64);
        const earthMat = new THREE.MeshPhongMaterial({
          map: earthMap,
          specular: new THREE.Color(0x38bdf8),
          shininess: 22
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        globeGroup.add(earthMesh);

        // 2. Drifting Cloud Layer
        const cloudGeo = new THREE.SphereGeometry(9.48, 64, 64);
        const cloudMat = new THREE.MeshPhongMaterial({
          map: cloudMap,
          transparent: true,
          opacity: 0.78,
          depthWrite: false
        });
        const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
        globeGroup.add(cloudMesh);
        cloudMeshRef.current = cloudMesh;

        // 3. Atmospheric Rim Glow Halo
        const atmoGeo = new THREE.SphereGeometry(9.78, 48, 48);
        const atmoMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.14,
          side: THREE.BackSide
        });
        const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
        globeGroup.add(atmoMesh);

        // 4. Illuminated Equatorial & Inclined Cinema Rings
        const createOrbitRing = (radius, colorHex, opacity, tiltX, tiltZ) => {
          const ringGeo = new THREE.RingGeometry(radius - 0.03, radius + 0.03, 128);
          const ringMat = new THREE.MeshBasicMaterial({
            color: colorHex,
            side: THREE.DoubleSide,
            transparent: true,
            opacity
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = tiltX;
          ring.rotation.z = tiltZ;
          globeGroup.add(ring);
          return ring;
        };
        createOrbitRing(11.3, 0xfbbf24, 0.34, Math.PI / 2.25, 0.18);
        createOrbitRing(12.2, 0x38bdf8, 0.28, Math.PI / 1.85, -0.24);

        // 5. Orbiting Cinema Asteroid Belt (130 tumbling 3D asteroids)
        const asteroidBeltGroup = new THREE.Group();
        globeGroup.add(asteroidBeltGroup);
        const asteroidGeo = new THREE.DodecahedronGeometry(0.16, 0);
        const asteroids = [];
        for (let i = 0; i < 130; i++) {
          const isGoldTint = i % 3 === 0;
          const astMat = new THREE.MeshStandardMaterial({
            color: isGoldTint ? 0xb45309 : 0x64748b,
            roughness: 0.85,
            metalness: 0.25
          });
          const mesh = new THREE.Mesh(asteroidGeo, astMat);
          const scale = 0.55 + Math.random() * 1.35;
          mesh.scale.set(scale, scale * 0.78, scale * 1.15);

          const orbitRadius = 12.6 + Math.random() * 3.4;
          const angle = Math.random() * Math.PI * 2;
          const inclination = (Math.random() - 0.5) * 0.42;
          const speed = (0.08 + Math.random() * 0.12) * (i % 2 === 0 ? 1 : -1);

          mesh.position.set(
            Math.cos(angle) * orbitRadius,
            Math.sin(angle * 2) * inclination * orbitRadius,
            Math.sin(angle) * orbitRadius
          );
          asteroidBeltGroup.add(mesh);
          asteroids.push({
            mesh,
            orbitRadius,
            angle,
            inclination,
            speed,
            rotSpeedX: (Math.random() - 0.5) * 2.2,
            rotSpeedY: (Math.random() - 0.5) * 2.2
          });
        }

        // 6. Two "ALL STARS" Orbiting Spaceships
        const bollywoodShip = createAllStarsSpaceship('BOLLYWOOD GALAXY', 0xfbbf24, '#fde047');
        const hollywoodShip = createAllStarsSpaceship('HOLLYWOOD GALAXY', 0x38bdf8, '#7dd3fc');
        globeGroup.add(bollywoodShip);
        globeGroup.add(hollywoodShip);

        // 7. Star Portrait Sprites & Constellation Groups
        const starSpritesGroup = new THREE.Group();
        globeGroup.add(starSpritesGroup);
        starSpritesGroupRef.current = starSpritesGroup;

        const constellationGroup = new THREE.Group();
        globeGroup.add(constellationGroup);
        constellationLinesRef.current = constellationGroup;

        defaultOrbTexRef.current.Bollywood = createDefaultOrbTexture('Bollywood');
        defaultOrbTexRef.current.Hollywood = createDefaultOrbTexture('Hollywood');

        // Raycaster for Hover & Click on Stars
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        const getIntersectedStar = (clientX, clientY) => {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);

          const sprites = Array.from(spritesMapRef.current.values()).filter((sp) => sp.visible);
          const hits = raycaster.intersectObjects(sprites, false);
          if (hits.length > 0) {
            return hits[0].object.userData.star || null;
          }
          return null;
        };

        const onPointerDown = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          isDraggingRef.current = true;
          flyToActiveRef.current = false;
          pointerDownPosRef.current = { x: clientX, y: clientY };
          prevMouseRef.current = { x: clientX, y: clientY };
        };

        const onPointerMove = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          if (isDraggingRef.current) {
            const dx = clientX - prevMouseRef.current.x;
            const dy = clientY - prevMouseRef.current.y;
            prevMouseRef.current = { x: clientX, y: clientY };

            targetSphericalRef.current.theta -= dx * 0.0055;
            targetSphericalRef.current.phi = Math.max(
              0.25,
              Math.min(Math.PI - 0.25, targetSphericalRef.current.phi - dy * 0.0055)
            );
          } else if (!e.touches) {
            const hitStar = getIntersectedStar(clientX, clientY);
            hoveredStarRef.current = hitStar;
            setHoveredStar(hitStar);
            setHoverPos({ x: clientX, y: clientY });
            renderer.domElement.style.cursor = hitStar ? 'pointer' : 'grab';
          }
        };

        const onPointerUp = (e) => {
          const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
          const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
          const distMoved = Math.hypot(
            clientX - pointerDownPosRef.current.x,
            clientY - pointerDownPosRef.current.y
          );
          isDraggingRef.current = false;

          if (distMoved <= 6) {
            const clickedStar = getIntersectedStar(clientX, clientY);
            if (clickedStar) {
              handleSelectStar(clickedStar);
            }
          }
        };

        const onWheel = (e) => {
          e.preventDefault();
          flyToActiveRef.current = false;
          const nextRadius = Math.max(
            MIN_ZOOM_DIST,
            Math.min(MAX_ZOOM_DIST, targetSphericalRef.current.radius + e.deltaY * 0.015)
          );
          targetSphericalRef.current.radius = nextRadius;
          setZoomLevel(distToZoomPct(nextRadius));
        };

        const domEl = renderer.domElement;
        domEl.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        domEl.addEventListener('touchstart', onPointerDown, { passive: true });
        domEl.addEventListener('touchmove', onPointerMove, { passive: true });
        domEl.addEventListener('touchend', onPointerUp);
        domEl.addEventListener('wheel', onWheel, { passive: false });

        const onResize = () => {
          if (!container) return;
          const w = container.clientWidth || window.innerWidth;
          const h = container.clientHeight || window.innerHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', onResize);

        // Animation Loop
        let animFrameId;
        const clock = new THREE.Clock();

        const animate = () => {
          animFrameId = requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.05);
          const elapsed = clock.getElapsedTime();

          // Gentle continuous auto-orbit when not dragging or locked onto a star card
          if (autoRotateRef.current && !isDraggingRef.current && !flyToActiveRef.current) {
            targetSphericalRef.current.theta += dt * 0.14;
          }

          // Smooth camera spherical damping
          sphericalRef.current.radius +=
            (targetSphericalRef.current.radius - sphericalRef.current.radius) * 0.08;
          sphericalRef.current.theta +=
            (targetSphericalRef.current.theta - sphericalRef.current.theta) * 0.08;
          sphericalRef.current.phi +=
            (targetSphericalRef.current.phi - sphericalRef.current.phi) * 0.08;

          camera.position.setFromSphericalCoords(
            sphericalRef.current.radius,
            sphericalRef.current.phi,
            sphericalRef.current.theta
          );
          camera.lookAt(0, 0, 0);

          // Rotate Earth cloud layer gently
          if (cloudMeshRef.current) {
            cloudMeshRef.current.rotation.y += dt * 0.025;
          }

          // Animate Asteroid Belt
          for (let i = 0; i < asteroids.length; i++) {
            const ast = asteroids[i];
            ast.angle += ast.speed * dt;
            ast.mesh.position.set(
              Math.cos(ast.angle) * ast.orbitRadius,
              Math.sin(ast.angle * 2) * ast.inclination * ast.orbitRadius,
              Math.sin(ast.angle) * ast.orbitRadius
            );
            ast.mesh.rotation.x += ast.rotSpeedX * dt;
            ast.mesh.rotation.y += ast.rotSpeedY * dt;
          }

          // Animate Twin "ALL STARS" Spaceships on opposing orbital tracks
          const ship1Angle = elapsed * 0.36;
          const ship1Radius = 13.4;
          const s1X = Math.cos(ship1Angle) * ship1Radius;
          const s1Y = Math.sin(ship1Angle * 1.5) * 3.1;
          const s1Z = Math.sin(ship1Angle) * ship1Radius;
          bollywoodShip.position.set(s1X, s1Y, s1Z);
          bollywoodShip.lookAt(
            Math.cos(ship1Angle + 0.08) * ship1Radius,
            Math.sin((ship1Angle + 0.08) * 1.5) * 3.1,
            Math.sin(ship1Angle + 0.08) * ship1Radius
          );

          const ship2Angle = elapsed * 0.31 + Math.PI;
          const ship2Radius = 14.3;
          const s2X = Math.cos(ship2Angle) * ship2Radius;
          const s2Y = -Math.sin(ship2Angle * 1.4) * 3.5;
          const s2Z = Math.sin(ship2Angle) * ship2Radius;
          hollywoodShip.position.set(s2X, s2Y, s2Z);
          hollywoodShip.lookAt(
            Math.cos(ship2Angle + 0.08) * ship2Radius,
            -Math.sin((ship2Angle + 0.08) * 1.4) * 3.5,
            Math.sin(ship2Angle + 0.08) * ship2Radius
          );

          // Pulse hovered & selected sprites
          spritesMapRef.current.forEach((sprite, wikiKey) => {
            if (!sprite.visible) return;
            const isHovered = hoveredStarRef.current && hoveredStarRef.current.wiki === wikiKey;
            const isSelected = selectedStarRef.current && selectedStarRef.current.wiki === wikiKey;
            const baseScale = sprite.userData.hasPhoto ? 0.92 : 0.62;
            const targetScale = isSelected ? 1.55 : isHovered ? 1.32 : baseScale;
            sprite.scale.lerp(new THREE.Vector3(targetScale, targetScale, 1), 0.16);
          });

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animFrameId);
          domEl.removeEventListener('mousedown', onPointerDown);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('mouseup', onPointerUp);
          domEl.removeEventListener('touchstart', onPointerDown);
          domEl.removeEventListener('touchmove', onPointerMove);
          domEl.removeEventListener('touchend', onPointerUp);
          domEl.removeEventListener('wheel', onWheel);
          window.removeEventListener('resize', onResize);
          renderer.dispose();
        };
      }, [handleSelectStar]);

      // ==========================================================================
      // 5. SYNCHRONIZE STAR SPRITES, FILTERS & CONSTELLATION LINKS
      // ==========================================================================
      useEffect(() => {
        const starGroup = starSpritesGroupRef.current;
        const lineGroup = constellationLinesRef.current;
        if (!starGroup || !lineGroup) return;

        const bollywoodStars = stars.filter((s) => s.industry === 'Bollywood');
        const hollywoodStars = stars.filter((s) => s.industry === 'Hollywood');

        let bIdx = 0;
        let hIdx = 0;

        stars.forEach((star) => {
          const isBolly = star.industry === 'Bollywood';
          const localIndex = isBolly ? bIdx++ : hIdx++;
          const totalInTerr = isBolly ? bollywoodStars.length : hollywoodStars.length;
          const pos = computeGlobePosition(localIndex, totalInTerr, star.industry, 10.15);

          let sprite = spritesMapRef.current.get(star.wiki);
          if (!sprite) {
            const mat = new THREE.SpriteMaterial({
              map: defaultOrbTexRef.current[star.industry],
              transparent: true,
              depthWrite: false
            });
            sprite = new THREE.Sprite(mat);
            sprite.userData = { star, hasPhoto: false };
            starGroup.add(sprite);
            spritesMapRef.current.set(star.wiki, sprite);
          }

          sprite.userData.star = star;
          sprite.position.copy(pos);
          sprite.visible = filteredWikiSet.has(star.wiki);

          if (star.photoUrl && !sprite.userData.hasPhoto && !sprite.userData.loadingPhoto) {
            sprite.userData.loadingPhoto = true;
            preloadImageElement(star.photoUrl).then((imgEl) => {
              if (imgEl && spritesMapRef.current.has(star.wiki)) {
                const portraitTex = createStarPortraitTexture(imgEl, star.industry, false);
                sprite.material.map = portraitTex;
                sprite.material.needsUpdate = true;
                sprite.userData.hasPhoto = true;
                loadedPhotosCountRef.current += 1;
                const photoCounterEl = document.getElementById('photo-counter');
                if (photoCounterEl) {
                  photoCounterEl.textContent = loadedPhotosCountRef.current.toLocaleString();
                }
              }
            });
          }
        });

        // Rebuild constellation lines
        while (lineGroup.children.length > 0) {
          const child = lineGroup.children[0];
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
          lineGroup.remove(child);
        }

        if (showConstellations) {
          const buildTerritoryLines = (list, colorHex) => {
            const visibleSprites = list
              .filter((s) => filteredWikiSet.has(s.wiki))
              .slice(0, 75)
              .map((s) => spritesMapRef.current.get(s.wiki))
              .filter(Boolean);

            if (visibleSprites.length < 2) return;
            const points = [];
            for (let i = 0; i < visibleSprites.length - 1; i++) {
              const a = visibleSprites[i].position;
              const b = visibleSprites[i + 1].position;
              if (a.distanceTo(b) < 7.5) {
                points.push(a.clone(), b.clone());
              }
            }
            if (points.length > 0) {
              const geo = new THREE.BufferGeometry().setFromPoints(points);
              const mat = new THREE.LineBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.24
              });
              lineGroup.add(new THREE.LineSegments(geo, mat));
            }
          };

          buildTerritoryLines(bollywoodStars, 0xfbbf24);
          buildTerritoryLines(hollywoodStars, 0x38bdf8);
        }
      }, [stars, filteredWikiSet, showConstellations]);

      // ==========================================================================
      // 6. ASYNCHRONOUS WIKIPEDIA API PIPELINE (EXPANDING TO 1,002 STARS)
      // ==========================================================================
      useEffect(() => {
        let cancelled = false;

        const hydrateAndExpandStars = async () => {
          const fullRoster = CURATED_STARS.map((s) => ({
            ...s,
            photoUrl: null,
            bio: `Legendary ${s.industry} figure celebrated in the ${s.era} constellation of Dheeraj's Cinema Galaxy.`
          }));

          // Hydrate curated 48 icons first
          const curatedTitles = fullRoster.map((s) => s.wiki);
          for (let i = 0; i < curatedTitles.length; i += 25) {
            if (cancelled) return;
            const batch = curatedTitles.slice(i, i + 25);
            try {
              const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(
                batch.join('|')
              )}&prop=pageimages|extracts&exintro=1&explaintext=1&pithumbsize=240&format=json&origin=*`;
              const res = await fetch(url);
              const data = await res.json();
              const pages = Object.values(data?.query?.pages || {});

              fullRoster.forEach((star) => {
                const page = pages.find(
                  (p) => p.title && p.title.toLowerCase() === star.wiki.toLowerCase()
                );
                if (page) {
                  if (isValidPhotoUrl(page.thumbnail?.source)) {
                    star.photoUrl = page.thumbnail.source;
                  }
                  if (page.extract && page.extract.length > 20) {
                    star.bio = page.extract;
                  }
                }
              });

              if (!cancelled) {
                setStars([...fullRoster]);
              }
            } catch {}
          }

          // Build candidate queue of 1,002+ stars (Curated Expansion Seeds + Live Wikipedia Category Harvesting)
          const seenNames = new Set(fullRoster.map((s) => s.name.toLowerCase()));
          const candidateQueue = [];

          EXPANSION_SEEDS.forEach((seed) => {
            if (!seenNames.has(seed.name.toLowerCase())) {
              seenNames.add(seed.name.toLowerCase());
              candidateQueue.push(seed);
            }
          });

          const categories = [
            { title: 'Category:Indian_film_actors', industry: 'Bollywood' },
            { title: 'Category:Indian_film_actresses', industry: 'Bollywood' },
            { title: 'Category:Hindi_film_actors', industry: 'Bollywood' },
            { title: 'Category:Hindi_film_actresses', industry: 'Bollywood' },
            { title: 'Category:American_film_actors', industry: 'Hollywood' },
            { title: 'Category:American_film_actresses', industry: 'Hollywood' },
            { title: 'Category:British_film_actors', industry: 'Hollywood' },
            { title: 'Category:British_film_actresses', industry: 'Hollywood' }
          ];

          for (const cat of categories) {
            if (cancelled || candidateQueue.length >= 1350) break;
            try {
              const catUrl = `https://en.wikipedia.org/w/api.php?action=query&list=categorymembers&cmtitle=${encodeURIComponent(
                cat.title
              )}&cmtype=page&cmlimit=220&format=json&origin=*`;
              const res = await fetch(catUrl);
              const data = await res.json();
              const members = data?.query?.categorymembers || [];
              members.forEach((m) => {
                const cleanName = m.title.replace(/\s*\(.*?\)\s*/g, '').trim();
                if (
                  cleanName &&
                  !cleanName.startsWith('List of') &&
                  !seenNames.has(cleanName.toLowerCase())
                ) {
                  seenNames.add(cleanName.toLowerCase());
                  candidateQueue.push({
                    name: cleanName,
                    industry: cat.industry,
                    wiki: m.title
                  });
                }
              });
            } catch {}
          }

          // Process candidate batches until TARGET_TOTAL (1,002) is reached
          for (let i = 0; i < candidateQueue.length; i += 25) {
            if (cancelled || fullRoster.length >= TARGET_TOTAL) break;
            const slice = candidateQueue.slice(i, i + 25);
            try {
              const queryUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(
                slice.map((c) => c.wiki).join('|')
              )}&prop=pageimages|extracts&exintro=1&explaintext=1&pithumbsize=220&format=json&origin=*`;
              const res = await fetch(queryUrl);
              const data = await res.json();
              const pages = Object.values(data?.query?.pages || {});

              const newlyAdded = [];
              await Promise.all(
                slice.map(async (c) => {
                  if (fullRoster.length + newlyAdded.length >= TARGET_TOTAL) return;
                  const page = pages.find(
                    (p) =>
                      p.title &&
                      (p.title.toLowerCase() === c.wiki.toLowerCase() ||
                        p.title.toLowerCase().startsWith(c.name.toLowerCase()))
                  );
                  const thumbSrc = page?.thumbnail?.source;
                  if (!isValidPhotoUrl(thumbSrc)) return;

                  const imgEl = await preloadImageElement(thumbSrc);
                  if (!imgEl) return;

                  const extract = page?.extract || '';
                  const bornMatch = extract.match(
                    /\bborn\s+([A-Z][a-z]+\s+\d{1,2},\s+\d{4}|\d{1,2}\s+[A-Z][a-z]+\s+\d{4})/
                  );
                  const diedMatch = extract.match(
                    /[–-]\s*([A-Z][a-z]+\s+\d{1,2},\s+\d{4}|\d{1,2}\s+[A-Z][a-z]+\s+\d{4})/
                  );
                  const era = inferEraFromText(extract, fullRoster.length + newlyAdded.length);

                  newlyAdded.push({
                    name: c.name,
                    industry: c.industry,
                    era,
                    epithet:
                      c.industry === 'Bollywood'
                        ? 'Indian Cinema Luminary'
                        : 'Hollywood Screen Icon',
                    born: bornMatch ? bornMatch[1] : 'Cinema Archive',
                    died: diedMatch ? diedMatch[1] : null,
                    awards:
                      c.industry === 'Bollywood'
                        ? 'Indian Cinema Honoree'
                        : 'International Screen Honoree',
                    movies: [
                      'Classic Feature',
                      'Acclaimed Drama',
                      'Box Office Hit',
                      'Signature Role'
                    ],
                    wiki: c.wiki,
                    photoUrl: thumbSrc,
                    bio:
                      extract.length > 25
                        ? extract
                        : `Celebrated ${c.industry} performer featured in the ${era} territory of Cinema Galaxy.`
                  });
                })
              );

              if (newlyAdded.length > 0 && !cancelled) {
                fullRoster.push(...newlyAdded);
                setStars([...fullRoster]);
                const starCounterEl = document.getElementById('star-counter');
                const expansionEl = document.getElementById('expansion-progress');
                if (starCounterEl) starCounterEl.textContent = fullRoster.length.toLocaleString();
                if (expansionEl && fullRoster.length < TARGET_TOTAL) {
                  expansionEl.textContent = `(Loading 1000+ stars: ${fullRoster.length}/${TARGET_TOTAL}...)`;
                } else if (expansionEl) {
                  expansionEl.textContent = '(1,002/1,002 Stars Loaded ✓)';
                }
              }
            } catch {}
          }
        };

        hydrateAndExpandStars();
        return () => {
          cancelled = true;
        };
      }, []);

      // ==========================================================================
      // 7. RENDER INTERACTIVE UI & 3D EARTH CANVAS
      // ==========================================================================
      return (
        <div className="relative w-full h-full overflow-hidden bg-slate-950">
          {/* 3D WebGL Canvas Container */}
          <div id="globe-canvas-container" ref={containerRef} className="absolute inset-0 z-0" />

          {/* TOP CASINO MARQUEE HEADER & CONTROLS */}
          <header className="fixed top-0 left-0 right-0 z-30 pointer-events-none px-3 sm:px-6 pt-3 sm:pt-4">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2.5">
              {/* Marquee Brand Card */}
              <div className="pointer-events-auto glass-panel rounded-2xl px-3.5 py-2.5 flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 via-yellow-500 to-amber-700 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-black text-lg">
                  🌍
                </div>
                <div>
                  <div className="h-1.5 w-full marquee-dots mb-0.5 rounded-full opacity-80" />
                  <h1 className="text-base sm:text-xl font-extrabold tracking-wider casino-bullet-text leading-tight">
                    DHEERAJ&apos;S CINEMA GALAXY
                  </h1>
                  <p className="text-[11px] sm:text-xs text-slate-300">
                    Bollywood &amp; Hollywood Earth •{' '}
                    <span id="star-counter" className="text-amber-400 font-bold">
                      {stars.length.toLocaleString()}
                    </span>{' '}
                    Stars
                    <span
                      id="expansion-progress"
                      className="text-amber-300/90 font-medium ml-1"
                    ></span>
                    <span className="text-emerald-400 font-semibold ml-1">
                      • <span id="photo-counter">0</span> Photos
                    </span>
                  </p>
                </div>
              </div>

              {/* Action Controls Bar */}
              <div className="pointer-events-auto flex flex-wrap items-center gap-1.5 sm:gap-2">
                {/* Territory Filter Pills */}
                <div className="glass-panel rounded-xl p-1 flex items-center gap-1">
                  {['All', 'Bollywood', 'Hollywood'].map((terr) => {
                    const active = industryFilter === terr;
                    return (
                      <button
                        key={terr}
                        onClick={() => setIndustryFilter(terr)}
                        className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition ${
                          active
                            ? terr === 'Bollywood'
                              ? 'bg-amber-500 text-slate-950 shadow-md'
                              : terr === 'Hollywood'
                              ? 'bg-sky-400 text-slate-950 shadow-md'
                              : 'bg-white text-slate-950 shadow-md'
                            : 'text-slate-300 hover:text-white'
                        }`}
                      >
                        {terr === 'Bollywood' ? '🇮🇳 Bollywood' : terr === 'Hollywood' ? '🇺🇸 Hollywood' : '✨ All'}
                      </button>
                    );
                  })}
                </div>

                {/* Inspect Featured Star */}
                <button
                  onClick={() => handleSelectStar(filteredStars[0] || stars[0])}
                  className="px-3 py-2 rounded-xl bg-amber-500/25 hover:bg-amber-500/35 border border-amber-400/60 text-amber-200 font-bold text-xs flex items-center gap-1.5 transition shadow-md"
                >
                  <span>⭐ Inspect Star</span>
                </button>

                {/* Auto-Orbit Toggle */}
                <button
                  onClick={() => setAutoRotate((v) => !v)}
                  className={`glass-pill px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 ${
                    autoRotate ? 'border-emerald-400/50 text-emerald-300' : 'text-slate-300'
                  }`}
                >
                  <span>{autoRotate ? '🌍 Orbit: ON' : '⏸️ Orbit: OFF'}</span>
                </button>

                {/* Soothing Cosmic Galaxy Music Toggle */}
                <button
                  onClick={toggleCosmicAudio}
                  className={`glass-pill px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 ${
                    audioPlaying
                      ? 'border-purple-400/70 bg-purple-500/20 text-purple-200 shadow-md shadow-purple-500/20'
                      : 'text-slate-300'
                  }`}
                  title="Play Soothing Copyright-Free Space Galaxy Ambient Music"
                >
                  <span>{audioPlaying ? '🎵 Galaxy Music: ON' : '🔇 Galaxy Music'}</span>
                </button>

                {/* Download GitHub Pages Ready index.html */}
                <button
                  onClick={handleDownloadGitHubPagesHtml}
                  className="px-3 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/60 text-emerald-200 font-bold text-xs flex items-center gap-1.5 transition shadow-md"
                  title="Download self-contained index.html ready to upload to GitHub Pages"
                >
                  <span>⬇️ Download index.html</span>
                </button>

                {/* Constellation Links Toggle */}
                <button
                  onClick={() => setShowConstellations((v) => !v)}
                  className={`glass-pill px-3 py-2 rounded-xl text-xs font-semibold hidden md:flex items-center gap-1.5 ${
                    showConstellations ? 'border-amber-400/50 text-amber-200' : 'text-slate-400'
                  }`}
                >
                  <span>✨ Links</span>
                </button>

                {/* Star Directory Drawer Button */}
                <button
                  onClick={() => setDirectoryOpen((v) => !v)}
                  className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/25 transition"
                >
                  <span>🔭 Directory ({filteredStars.length})</span>
                </button>
              </div>
            </div>
          </header>

          {/* GITHUB PAGES DOWNLOAD CONFIRMATION TOAST */}
          {downloadToast && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 glass-panel border border-emerald-400/60 rounded-2xl px-4 py-3 shadow-2xl flex items-center gap-3">
              <span className="text-lg">🚀</span>
              <div className="text-xs">
                <div className="font-extrabold text-emerald-300">
                  Downloaded index.html for GitHub Pages!
                </div>
                <div className="text-slate-300 mt-0.5">
                  Upload <span className="font-mono text-amber-300">index.html</span> to your GitHub repo → Settings → Pages → Deploy from main branch.
                </div>
              </div>
            </div>
          )}

          {/* HOVER TOOLTIP PILL */}
          {hoveredStar && !selectedStar && (
            <div
              style={{
                left: Math.min(window.innerWidth - 230, hoverPos.x + 14),
                top: Math.max(80, hoverPos.y - 24)
              }}
              className="fixed z-20 pointer-events-none glass-panel rounded-xl px-3 py-2 flex items-center gap-2.5 shadow-xl"
            >
              {hoveredStar.photoUrl ? (
                <img
                  src={hoveredStar.photoUrl}
                  alt={hoveredStar.name}
                  className="w-8 h-8 rounded-full object-cover border border-amber-400"
                />
              ) : (
                <div className="w-8 h-8 rounded-full bg-amber-500/25 border border-amber-400 flex items-center justify-center text-xs font-bold text-amber-300">
                  {hoveredStar.name.charAt(0)}
                </div>
              )}
              <div>
                <div className="text-xs font-extrabold text-white">{hoveredStar.name}</div>
                <div className="text-[10px] text-amber-300 font-medium">
                  {hoveredStar.industry} • Click to inspect
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM-LEFT ZOOM SLIDER HUD */}
          <div className="fixed bottom-4 left-4 z-30 glass-panel rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
            <span className="text-[11px] font-bold text-amber-300 uppercase tracking-wider">
              Zoom
            </span>
            <button
              onClick={() => handleZoomSliderChange(zoomLevel - 10)}
              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm flex items-center justify-center border border-slate-600/60"
              aria-label="Zoom Out"
            >
              −
            </button>
            <input
              type="range"
              min="0"
              max="100"
              value={zoomLevel}
              onChange={(e) => handleZoomSliderChange(e.target.value)}
              className="w-24 sm:w-32 accent-amber-400 cursor-pointer"
              aria-label="Galaxy Zoom Level"
            />
            <button
              onClick={() => handleZoomSliderChange(zoomLevel + 10)}
              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm flex items-center justify-center border border-slate-600/60"
              aria-label="Zoom In"
            >
              +
            </button>
            <span className="text-xs font-mono font-bold text-white w-9 text-right">
              {zoomLevel}%
            </span>
            <button
              onClick={handleResetCamera}
              className="ml-1 px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-200 text-[11px] font-bold"
            >
              Reset
            </button>
          </div>

          {/* BOTTOM-RIGHT TERRITORY LEGEND */}
          <div className="fixed bottom-4 right-4 z-20 hidden sm:flex glass-panel rounded-2xl px-3.5 py-2 items-center gap-3 text-[11px] text-slate-300">
            <span className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-full bg-amber-400 shadow shadow-amber-400"></span>
              Bollywood (India/Asia)
            </span>
            <span className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-full bg-sky-400 shadow shadow-sky-400"></span>
              Hollywood (Americas)
            </span>
            <span className="text-slate-400">• Drag to spin • Click star for dossier</span>
          </div>

          {/* SLIDE-OVER SEARCHABLE DIRECTORY DRAWER */}
          {directoryOpen && (
            <aside className="fixed top-20 right-3 sm:right-6 bottom-16 w-[calc(100vw-24px)] sm:w-96 z-40 glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl">
              <div className="p-3.5 border-b border-slate-700/70 flex items-center justify-between">
                <div>
                  <h2 className="text-sm font-extrabold text-amber-300 tracking-wide">
                    CINEMA GALAXY DIRECTORY
                  </h2>
                  <p className="text-[11px] text-slate-400">
                    Showing {filteredStars.length} of {stars.length} stars
                  </p>
                </div>
                <button
                  onClick={() => setDirectoryOpen(false)}
                  className="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center"
                >
                  ✕
                </button>
              </div>

              <div className="p-3 space-y-2 border-b border-slate-800">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search actor, epithet, or movie..."
                  className="w-full px-3 py-2 rounded-xl bg-slate-900/90 border border-slate-700 focus:border-amber-400 focus:outline-none text-xs text-white placeholder-slate-400"
                />
                <div className="flex gap-1 overflow-x-auto pb-1">
                  {['All', 'Golden Era', 'Classic / 80s-90s', 'Modern / 2000s+'].map((era) => (
                    <button
                      key={era}
                      onClick={() => setEraFilter(era)}
                      className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold whitespace-nowrap transition ${
                        eraFilter === era
                          ? 'bg-amber-400 text-slate-950 font-bold'
                          : 'bg-slate-800/80 text-slate-300 hover:text-white'
                      }`}
                    >
                      {era}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex-1 overflow-y-auto cinema-scroll p-2.5 space-y-1.5">
                {filteredStars.map((s) => (
                  <button
                    key={s.wiki}
                    onClick={() => {
                      handleSelectStar(s);
                      if (window.innerWidth < 640) setDirectoryOpen(false);
                    }}
                    className={`w-full text-left p-2.5 rounded-xl border transition flex items-center gap-3 ${
                      selectedStar && selectedStar.wiki === s.wiki
                        ? 'bg-amber-500/20 border-amber-400'
                        : 'bg-slate-900/60 hover:bg-slate-800/80 border-slate-800'
                    }`}
                  >
                    {s.photoUrl ? (
                      <img
                        src={s.photoUrl}
                        alt={s.name}
                        className="w-10 h-10 rounded-full object-cover border border-amber-400/60 shrink-0"
                      />
                    ) : (
                      <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-extrabold text-amber-300 shrink-0">
                        {s.name.charAt(0)}
                      </div>
                    )}
                    <div className="min-w-0 flex-1">
                      <div className="text-xs font-bold text-white truncate">{s.name}</div>
                      <div className="text-[11px] text-slate-400 truncate">{s.epithet}</div>
                      <div className="flex items-center gap-1.5 mt-0.5">
                        <span
                          className={`text-[10px] font-bold px-1.5 py-0.2 rounded ${
                            s.industry === 'Bollywood'
                              ? 'bg-amber-500/20 text-amber-300'
                              : 'bg-sky-500/20 text-sky-300'
                          }`}
                        >
                          {s.industry}
                        </span>
                        <span className="text-[10px] text-slate-500">{s.era}</span>
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            </aside>
          )}

          {/* COMPLETE SCROLLABLE STAR DOSSIER MODAL CARD */}
          {selectedStar && (
            <div
              onClick={handleCloseStarCard}
              className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-xl max-h-[88vh] overflow-y-auto cinema-scroll bg-slate-900 border-2 border-amber-400/50 rounded-3xl shadow-2xl p-5 sm:p-6 text-white relative"
              >
                {/* Top Navigation & Close Row */}
                <div className="flex items-center justify-between gap-2 pb-4 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleNavigateStar(-1)}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700"
                    >
                      ← Prev
                    </button>
                    <button
                      onClick={() => handleNavigateStar(1)}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700"
                    >
                      Next →
                    </button>
                  </div>
                  <button
                    onClick={handleCloseStarCard}
                    className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-rose-500/25 hover:text-rose-300 border border-slate-700 text-slate-200 font-extrabold flex items-center justify-center transition"
                    aria-label="Close Dossier"
                  >
                    ✕
                  </button>
                </div>

                {/* Portrait & Title Header */}
                <div className="flex flex-col sm:flex-row items-center sm:items-start gap-4 mt-4">
                  {selectedStar.photoUrl ? (
                    <img
                      src={selectedStar.photoUrl}
                      alt={selectedStar.name}
                      className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover border-2 border-amber-400 shadow-lg shrink-0"
                    />
                  ) : (
                    <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-gradient-to-br from-amber-500/30 to-sky-500/30 border-2 border-amber-400 flex items-center justify-center text-3xl font-black text-amber-300 shrink-0">
                      {selectedStar.name.charAt(0)}
                    </div>
                  )}

                  <div className="text-center sm:text-left flex-1">
                    <div className="flex flex-wrap items-center justify-center sm:justify-start gap-2 mb-1.5">
                      <span
                        className={`px-2.5 py-0.5 rounded-full text-xs font-extrabold ${
                          selectedStar.industry === 'Bollywood'
                            ? 'bg-amber-400 text-slate-950'
                            : 'bg-sky-400 text-slate-950'
                        }`}
                      >
                        {selectedStar.industry}
                      </span>
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-800 text-amber-200 border border-slate-700">
                        {selectedStar.era}
                      </span>
                    </div>

                    <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight">
                      {selectedStar.name}
                    </h2>
                    <p className="text-sm font-semibold text-amber-300 mt-0.5">
                      {selectedStar.epithet}
                    </p>
                  </div>
                </div>

                {/* Lifespan & Awards Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5">
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                      📅 Born &amp; Lifespan
                    </div>
                    <div className="text-sm font-bold text-white mt-1">
                      Born: {selectedStar.born}
                    </div>
                    <div className="text-xs text-slate-300 mt-0.5">
                      {selectedStar.died ? `Passed: ${selectedStar.died}` : 'Living Cinema Legend'}
                    </div>
                  </div>

                  <div className="bg-amber-500/10 border border-amber-400/40 rounded-2xl p-3.5">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-amber-300">
                      🏆 Awards &amp; Honours
                    </div>
                    <div className="text-sm font-bold text-white mt-1 leading-snug">
                      {selectedStar.awards}
                    </div>
                  </div>
                </div>

                {/* Signature Credits */}
                <div className="mt-4 bg-slate-800/60 border border-slate-700/70 rounded-2xl p-3.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-sky-300 mb-2">
                    🎬 Signature Films &amp; Credits
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {selectedStar.movies.map((movie, idx) => (
                      <span
                        key={idx}
                        className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-xs font-semibold text-slate-100"
                      >
                        {movie}
                      </span>
                    ))}
                  </div>
                </div>

                {/* Full Biography */}
                <div className="mt-4 bg-slate-800/60 border border-slate-700/70 rounded-2xl p-4">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 mb-1.5">
                    📖 Cinema Biography
                  </div>
                  <p className="text-sm text-slate-200 leading-relaxed whitespace-pre-line">
                    {liveBioCache[selectedStar.wiki] || selectedStar.bio}
                  </p>
                </div>

                {/* Footer Actions */}
                <div className="mt-5 pt-4 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <a
                    href={`https://en.wikipedia.org/wiki/${encodeURIComponent(selectedStar.wiki)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs transition shadow-md"
                  >
                    Read Full Wikipedia Article ↗
                  </a>
                  <button
                    onClick={handleCloseStarCard}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700"
                  >
                    Resume Earth Orbit
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CinemaGalaxyApp />);
  </script>

</body></html>
